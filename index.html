<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>RogerVIB</title>
  <link rel="stylesheet" href="styles.css?v=0.9.1" />
  <link rel="stylesheet" href="widgets.css?v=0.9.1" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand-row">
        <div class="brand">RogerVIB</div>
        <button class="icon-button" id="collapseButton" aria-label="Collapse sidebar">◧</button>
      </div>

      <button class="new-chat" id="newChatButton">
        <span class="new-chat-icon">✎</span>
        <span>New chat</span>
      </button>

      <div class="sidebar-section-title">Chats</div>
      <div class="chat-list" id="chatList"></div>
    </aside>

    <main class="main-panel">
      <header class="topbar">
        <button class="mobile-sidebar-button" id="mobileSidebarButton" aria-label="Open sidebar">☰</button>
        <div class="topbar-spacer"></div>
        <button class="copy-chat-button" id="copyChatButton" type="button" aria-label="Copy current chat">Copy Chat</button>
      </header>

      <section class="conversation" id="conversation">
        <div class="empty-state" id="emptyState">
          <div class="logo-orb">R</div>
          <h1>What can I help with?</h1>
          <p id="modelDescription">Connecting to Ollama…</p>
        </div>
      </section>

      <div class="composer-wrap">
        <form class="composer" id="chatForm">
          <textarea id="messageInput" rows="1" placeholder="Message RogerVIB" aria-label="Message RogerVIB"></textarea>
          <div class="composer-bottom">
            <button class="plus-button" type="button" aria-label="Add">+</button>
            <div class="composer-actions">
              <select id="modelPicker" class="model-picker" aria-label="Choose Ollama model">
                <option>Connecting to Ollama…</option>
              </select>
              <button class="send-button" id="sendButton" type="submit" aria-label="Send">↑</button>
            </div>
          </div>
        </form>
        <div class="disclaimer">RogerVIB uses your local Ollama models. Tools and safe widgets are supplied by RogerVIB.</div>
      </div>
    </main>
  </div>

  <!-- RogerVIB no longer loads any built-in/custom AI model. -->
  <!-- These scripts only define tool implementations and safe UI widgets that Ollama models can call. -->
  <script src="tools/tools.js?v=0.9.1"></script>
  <script src="tools/calculator.js?v=0.9.1"></script>
  <script src="tools/web-search.js?v=0.9.1"></script>
  <script src="tools/widget-observer-guard.js?v=0.9.1"></script>
  <script src="tools/widgets.js?v=0.9.1"></script>
  <script src="main.js?v=0.9.1"></script>
</body>
</html>
