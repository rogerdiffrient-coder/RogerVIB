<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>RogerVIB</title>
  <link rel="stylesheet" href="styles.css?v=0.5.1" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand-row">
        <div class="brand">RogerVIB</div>
        <button class="icon-button" id="collapseButton" aria-label="Collapse sidebar">◧</button>
      </div>

      <button class="new-chat" id="newChatButton">
        <span class="new-chat-icon">✎</span>
        <span>New chat</span>
      </button>

      <div class="sidebar-section-title">Chats</div>
      <div class="chat-list" id="chatList"></div>
    </aside>

    <main class="main-panel">
      <header class="topbar">
        <button class="mobile-sidebar-button" id="mobileSidebarButton" aria-label="Open sidebar">☰</button>
        <div class="topbar-spacer"></div>
        <button class="beta-test-button" id="betaTestButton" type="button" aria-label="Beta test experimental RogerVIB models">Beta Test</button>
        <button class="copy-chat-button" id="copyChatButton" type="button" aria-label="Copy current chat">Copy Chat</button>
      </header>

      <section class="conversation" id="conversation">
        <div class="empty-state" id="emptyState">
          <div class="logo-orb">R</div>
          <h1>What can I help with?</h1>
          <p id="modelDescription"></p>
        </div>
      </section>

      <div class="composer-wrap">
        <form class="composer" id="chatForm">
          <textarea id="messageInput" rows="1" placeholder="Message RogerVIB" aria-label="Message RogerVIB"></textarea>
          <div class="composer-bottom">
            <button class="plus-button" type="button" aria-label="Add">+</button>
            <div class="composer-actions">
              <select id="modelPicker" class="model-picker" aria-label="Choose RogerVIB model"></select>
              <button class="send-button" id="sendButton" type="submit" aria-label="Send">↑</button>
            </div>
          </div>
        </form>
        <div class="disclaimer">RogerVIB can make mistakes. Especially right now.</div>
      </div>
    </main>
  </div>

  <div class="beta-modal-backdrop hidden" id="betaModalBackdrop" role="presentation">
    <section class="beta-modal" id="betaModal" role="dialog" aria-modal="true" aria-labelledby="betaModalTitle">
      <div class="beta-modal-header">
        <div>
          <div class="beta-kicker">EXPERIMENTAL</div>
          <h2 id="betaModalTitle">Beta Test</h2>
        </div>
        <button class="beta-close-button" id="betaCloseButton" type="button" aria-label="Close beta test">×</button>
      </div>
      <p class="beta-intro">Try unfinished RogerVIB models before they become stable. They may be slower, stranger, or occasionally decide the answer is 4243.</p>
      <div class="beta-model-list" id="betaModelList"></div>
    </section>
  </div>

  <!-- Decent v2: generated config + 12 int8/base64 weight chunks. -->
  <script src="decent-v2-config.js?v=0.5.0"></script>
  <script src="decent-v2-part0.js?v=0.5.0"></script>
  <script src="decent-v2-part1.js?v=0.5.0"></script>
  <script src="decent-v2-part2.js?v=0.5.0"></script>
  <script src="decent-v2-part3.js?v=0.5.0"></script>
  <script src="decent-v2-part4.js?v=0.5.0"></script>
  <script src="decent-v2-part5.js?v=0.5.0"></script>
  <script src="decent-v2-part6.js?v=0.5.0"></script>
  <script src="decent-v2-part7.js?v=0.5.0"></script>
  <script src="decent-v2-part8.js?v=0.5.0"></script>
  <script src="decent-v2-part9.js?v=0.5.0"></script>
  <script src="decent-v2-part10.js?v=0.5.0"></script>
  <script src="decent-v2-part11.js?v=0.5.0"></script>


  <!-- RogerVIB v0.5 Cool tools + weights -->
  <script src="tools/tools.js?v=0.5.0"></script>
  <script src="tools/calculator.js?v=0.5.0"></script>
  <script src="tools/web-search.js?v=0.5.0"></script>
  <script src="cool-v1-loader.js?v=0.5.0"></script>
  <!-- End Cool v0.5 -->

  <!-- Brah's trained intent weights remain for the older model/fallback. -->
  <script src="brah-model.js?v=0.5.0"></script>

  <!-- Shared app first, then each independently registered model. -->
  <script src="main.js?v=0.5.1"></script>
  <script src="models/brick.js?v=0.5.0"></script>
  <script src="models/spark.js?v=0.5.0"></script>
  <script src="models/ember.js?v=0.5.0"></script>
  <script src="models/brah.js?v=0.5.0"></script>
  <script src="models/decent.js?v=0.5.0"></script>
  <script src="models/cool.js?v=0.5.0"></script>
  <script src="beta-ui.js?v=0.5.1"></script>
</body>
</html>
