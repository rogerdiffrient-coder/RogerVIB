<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>RogerVIB</title>
  <link rel="stylesheet" href="styles.css?v=0.4.3" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand-row">
        <div class="brand">RogerVIB</div>
        <button class="icon-button" id="collapseButton" aria-label="Collapse sidebar">◧</button>
      </div>

      <button class="new-chat" id="newChatButton">
        <span class="new-chat-icon">✎</span>
        <span>New chat</span>
      </button>

      <div class="sidebar-section-title">Chats</div>
      <div class="chat-list" id="chatList"></div>
    </aside>

    <main class="main-panel">
      <header class="topbar">
        <button class="mobile-sidebar-button" id="mobileSidebarButton" aria-label="Open sidebar">☰</button>
      </header>

      <section class="conversation" id="conversation">
        <div class="empty-state" id="emptyState">
          <div class="logo-orb">R</div>
          <h1>What can I help with?</h1>
          <p id="modelDescription"></p>
        </div>
      </section>

      <div class="composer-wrap">
        <form class="composer" id="chatForm">
          <textarea id="messageInput" rows="1" placeholder="Message RogerVIB" aria-label="Message RogerVIB"></textarea>
          <div class="composer-bottom">
            <button class="plus-button" type="button" aria-label="Add">+</button>
            <div class="composer-actions">
              <select id="modelPicker" class="model-picker" aria-label="Choose RogerVIB model"></select>
              <button class="send-button" id="sendButton" type="submit" aria-label="Send">↑</button>
            </div>
          </div>
        </form>
        <div class="disclaimer">RogerVIB can make mistakes. Especially right now.</div>
      </div>
    </main>
  </div>

  <!-- Starts Decent's async trained-weight loader and exposes DECENT_MODEL_READY. -->
  <script src="decent-model-loader.js?v=0.4.3"></script>

  <!-- Brah keeps its compiled learned intent weights separate too. -->
  <script src="brah-model.js?v=0.4.3"></script>

  <!-- Shared app first, then each independently registered model. -->
  <script src="main.js?v=0.4.3"></script>
  <script src="models/brick.js?v=0.4.3"></script>
  <script src="models/spark.js?v=0.4.3"></script>
  <script src="models/ember.js?v=0.4.3"></script>
  <script src="models/brah.js?v=0.4.3"></script>
  <script src="models/decent.js?v=0.4.3"></script>
  <script src="models/decent-fallback.js?v=0.4.3"></script>
</body>
</html>
