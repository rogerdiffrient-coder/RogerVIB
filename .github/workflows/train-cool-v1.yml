name: Train Cool v1

on:
  push:
    paths:
      - 'train_cool_v1.py'
      - '.github/workflows/train-cool-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install training dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Train and quantize Cool
        run: python train_cool_v1.py
      - name: Commit trained weights
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cool-v1-config.js cool-v1-part*.js cool-v1-manifest.json
          git diff --cached --quiet && exit 0
          git commit -m 'Train RogerVIB v0.5 Cool [skip ci]'
          # The repo may have changed while this multi-minute training job was running.
          # Rebase the generated-weight commit onto the newest main instead of losing
          # the entire run to a non-fast-forward push rejection.
          git pull --rebase origin main
          git push origin HEAD:main
