name: Train RogerVIB Micro v0.4 (10 epochs)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'training/v04_corpus*.jsonl'
      - 'training/train_v04.py'
      - 'training/train_v04_fast.py'
      - 'training/train_v04_10.py'
      - 'training/publish_v04_telemetry_10.sh'
      - '.github/actions/train-v04-epoch/action.yml'
      - 'tests/validate_v04_artifact.py'
      - 'tests/smoke_v04_inference.py'
      - '.github/workflows/train-micro-v04-10.yml'

permissions:
  contents: write

concurrency:
  group: train-rogervib-micro-v04
  cancel-in-progress: true

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: REPORT STARTED IMMEDIATELY
        run: bash training/publish_v04_telemetry_10.sh started 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install trainer dependencies
        run: |
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet numpy

      - name: Epoch 1/10
        uses: ./.github/actions/train-v04-epoch
        with: {epoch: '1'}
      - name: Epoch 2/10
        uses: ./.github/actions/train-v04-epoch
        with: {epoch: '2'}
      - name: Epoch 3/10
        uses: ./.github/actions/train-v04-epoch
        with: {epoch: '3'}
      - name: Epoch 4/10
        uses: ./.github/actions/train-v04-epoch
        with: {epoch: '4'}
      - name: Epoch 5/10
        uses: ./.github/actions/train-v04-epoch
        with: {epoch: '5'}
      - name: Epoch 6/10
        uses: ./.github/actions/train-v04-epoch
        with: {epoch: '6'}
      - name: Epoch 7/10
        uses: ./.github/actions/train-v04-epoch
        with: {epoch: '7'}
      - name: Epoch 8/10
        uses: ./.github/actions/train-v04-epoch
        with: {epoch: '8'}
      - name: Epoch 9/10
        uses: ./.github/actions/train-v04-epoch
        with: {epoch: '9'}
      - name: Epoch 10/10
        uses: ./.github/actions/train-v04-epoch
        with: {epoch: '10'}

      - name: Promote epoch 10 to candidate path
        run: |
          rm -rf models/micro-v0.4
          cp -R models/micro-v0.4-epoch-10 models/micro-v0.4

      - name: Validate generated model
        run: python tests/validate_v04_artifact.py

      - name: Browser-like quality test
        id: quality
        continue-on-error: true
        env:
          ROGERVIB_QUALITY_REPORT: training/latest_v04_quality_report.txt
        run: python tests/smoke_v04_inference.py

      - name: Upload final quality diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rogervib-v04-quality-report
          path: training/latest_v04_quality_report.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Report quality success
        if: steps.quality.outcome == 'success'
        run: bash training/publish_v04_telemetry_10.sh quality 10

      - name: Report quality failure
        if: steps.quality.outcome != 'success'
        run: bash training/publish_v04_telemetry_10.sh quality_failed 10

      - name: Reject failed candidate
        if: steps.quality.outcome != 'success'
        run: exit 1

      - name: Publish final pretrained model artifact
        run: |
          git config user.name 'RogerVIB Trainer'
          git config user.email 'actions@users.noreply.github.com'
          git add -A models/micro-v0.4
          if ! git diff --cached --quiet; then
            git commit -m 'Train RogerVIB Micro v0.4 10-epoch quality model [skip ci]'
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi

      - name: REPORT PUBLISHED
        run: bash training/publish_v04_telemetry_10.sh published 10
