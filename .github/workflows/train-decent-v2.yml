name: Train Decent v2

on:
  push:
    paths:
      - 'train_decent_v2.py'
      - '.github/workflows/train-decent-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install training dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Train and quantize Decent v2
        run: python train_decent_v2.py
      - name: Commit trained weights
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add decent-v2-config.js decent-v2-part*.js decent-v2-manifest.json
          git diff --cached --quiet && exit 0
          git commit -m 'Train RogerVIB v0.4 Decent v2 [skip ci]'
          git push
