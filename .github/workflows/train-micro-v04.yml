name: Train RogerVIB Micro v0.4

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'training/v04_corpus*.jsonl'
      - 'training/train_v04.py'
      - 'training/train_v04_fast.py'
      - 'tests/validate_v04_artifact.py'
      - 'tests/smoke_v04_inference.py'
      - '.github/workflows/train-micro-v04.yml'

permissions:
  contents: write

concurrency:
  group: train-rogervib-micro-v04
  cancel-in-progress: true

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: REPORT STARTED
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          Path('training/latest_v04_status.json').write_text(json.dumps({
            'status': 'STARTED',
            'run_id': os.environ.get('GITHUB_RUN_ID'),
            'run_attempt': os.environ.get('GITHUB_RUN_ATTEMPT'),
            'trigger_sha': os.environ.get('GITHUB_SHA'),
            'started_at': datetime.now(timezone.utc).isoformat(),
            'message': 'GitHub Actions run started and reached the first reporting step.'
          }, indent=2))
          PY
          git config user.name 'RogerVIB Trainer'
          git config user.email 'actions@users.noreply.github.com'
          git add training/latest_v04_status.json
          git commit -m 'RogerVIB v0.4 training STARTED [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install trainer dependencies
        run: |
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet numpy

      - name: Train epoch 1 of 5
        id: epoch1
        continue-on-error: true
        timeout-minutes: 5
        run: |
          set -o pipefail
          python -u training/train_v04_fast.py --epoch 1 2>&1 | tee training/epoch-1.log

      - name: Upload epoch 1 checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rogervib-v04-epoch-1-${{ github.run_id }}
          path: |
            training/v04_checkpoints/epoch-1
            training/epoch-1.log
            training/v04_epoch_1_metrics.json
          if-no-files-found: warn
          retention-days: 30

      - name: REPORT epoch 1
        if: always()
        env:
          OUTCOME: ${{ steps.epoch1.outcome }}
        run: |
          cp training/epoch-1.log training/latest_v04_training_log.txt 2>/dev/null || true
          if [ "$OUTCOME" = "success" ]; then
            rm -rf models/micro-v0.4-preview
            cp -R training/v04_checkpoints/epoch-1 models/micro-v0.4-preview
          fi
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          outcome = os.environ['OUTCOME']
          p = Path('training/v04_epoch_1_metrics.json')
          metrics = json.loads(p.read_text()) if p.exists() else {}
          data = {
            'status': 'EPOCH_1_COMPLETE' if outcome == 'success' else 'FAILED_EPOCH_1',
            'epoch': 1, 'epochs': 5, 'outcome': outcome,
            'reported_at': datetime.now(timezone.utc).isoformat(), **metrics
          }
          Path('training/latest_v04_status.json').write_text(json.dumps(data, indent=2))
          PY
          git config user.name 'RogerVIB Trainer'
          git config user.email 'actions@users.noreply.github.com'
          git add training/latest_v04_status.json training/latest_v04_training_log.txt
          if [ "$OUTCOME" = "success" ]; then git add -A models/micro-v0.4-preview; fi
          git commit -m "Report RogerVIB v0.4 epoch 1/5 ($OUTCOME) [skip ci]" || true
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - name: Stop after epoch 1 failure
        if: steps.epoch1.outcome != 'success'
        run: exit 1

      - name: Train epoch 2 of 5
        id: epoch2
        continue-on-error: true
        timeout-minutes: 5
        run: |
          set -o pipefail
          python -u training/train_v04_fast.py --epoch 2 2>&1 | tee training/epoch-2.log

      - name: Upload epoch 2 checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rogervib-v04-epoch-2-${{ github.run_id }}
          path: |
            training/v04_checkpoints/epoch-2
            training/epoch-2.log
            training/v04_epoch_2_metrics.json
          if-no-files-found: warn
          retention-days: 30

      - name: REPORT epoch 2
        if: always()
        env:
          OUTCOME: ${{ steps.epoch2.outcome }}
        run: |
          cp training/epoch-2.log training/latest_v04_training_log.txt 2>/dev/null || true
          if [ "$OUTCOME" = "success" ]; then
            rm -rf models/micro-v0.4-preview
            cp -R training/v04_checkpoints/epoch-2 models/micro-v0.4-preview
          fi
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          outcome = os.environ['OUTCOME']
          p = Path('training/v04_epoch_2_metrics.json')
          metrics = json.loads(p.read_text()) if p.exists() else {}
          data = {'status': 'EPOCH_2_COMPLETE' if outcome == 'success' else 'FAILED_EPOCH_2',
                  'epoch': 2, 'epochs': 5, 'outcome': outcome,
                  'reported_at': datetime.now(timezone.utc).isoformat(), **metrics}
          Path('training/latest_v04_status.json').write_text(json.dumps(data, indent=2))
          PY
          git add training/latest_v04_status.json training/latest_v04_training_log.txt
          if [ "$OUTCOME" = "success" ]; then git add -A models/micro-v0.4-preview; fi
          git commit -m "Report RogerVIB v0.4 epoch 2/5 ($OUTCOME) [skip ci]" || true
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - name: Stop after epoch 2 failure
        if: steps.epoch2.outcome != 'success'
        run: exit 1

      - name: Train epoch 3 of 5
        id: epoch3
        continue-on-error: true
        timeout-minutes: 5
        run: |
          set -o pipefail
          python -u training/train_v04_fast.py --epoch 3 2>&1 | tee training/epoch-3.log

      - name: Upload epoch 3 checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rogervib-v04-epoch-3-${{ github.run_id }}
          path: |
            training/v04_checkpoints/epoch-3
            training/epoch-3.log
            training/v04_epoch_3_metrics.json
          if-no-files-found: warn
          retention-days: 30

      - name: REPORT epoch 3
        if: always()
        env:
          OUTCOME: ${{ steps.epoch3.outcome }}
        run: |
          cp training/epoch-3.log training/latest_v04_training_log.txt 2>/dev/null || true
          if [ "$OUTCOME" = "success" ]; then
            rm -rf models/micro-v0.4-preview
            cp -R training/v04_checkpoints/epoch-3 models/micro-v0.4-preview
          fi
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          outcome = os.environ['OUTCOME']
          p = Path('training/v04_epoch_3_metrics.json')
          metrics = json.loads(p.read_text()) if p.exists() else {}
          data = {'status': 'EPOCH_3_COMPLETE' if outcome == 'success' else 'FAILED_EPOCH_3',
                  'epoch': 3, 'epochs': 5, 'outcome': outcome,
                  'reported_at': datetime.now(timezone.utc).isoformat(), **metrics}
          Path('training/latest_v04_status.json').write_text(json.dumps(data, indent=2))
          PY
          git add training/latest_v04_status.json training/latest_v04_training_log.txt
          if [ "$OUTCOME" = "success" ]; then git add -A models/micro-v0.4-preview; fi
          git commit -m "Report RogerVIB v0.4 epoch 3/5 ($OUTCOME) [skip ci]" || true
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - name: Stop after epoch 3 failure
        if: steps.epoch3.outcome != 'success'
        run: exit 1

      - name: Train epoch 4 of 5
        id: epoch4
        continue-on-error: true
        timeout-minutes: 5
        run: |
          set -o pipefail
          python -u training/train_v04_fast.py --epoch 4 2>&1 | tee training/epoch-4.log

      - name: Upload epoch 4 checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rogervib-v04-epoch-4-${{ github.run_id }}
          path: |
            training/v04_checkpoints/epoch-4
            training/epoch-4.log
            training/v04_epoch_4_metrics.json
          if-no-files-found: warn
          retention-days: 30

      - name: REPORT epoch 4
        if: always()
        env:
          OUTCOME: ${{ steps.epoch4.outcome }}
        run: |
          cp training/epoch-4.log training/latest_v04_training_log.txt 2>/dev/null || true
          if [ "$OUTCOME" = "success" ]; then
            rm -rf models/micro-v0.4-preview
            cp -R training/v04_checkpoints/epoch-4 models/micro-v0.4-preview
          fi
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          outcome = os.environ['OUTCOME']
          p = Path('training/v04_epoch_4_metrics.json')
          metrics = json.loads(p.read_text()) if p.exists() else {}
          data = {'status': 'EPOCH_4_COMPLETE' if outcome == 'success' else 'FAILED_EPOCH_4',
                  'epoch': 4, 'epochs': 5, 'outcome': outcome,
                  'reported_at': datetime.now(timezone.utc).isoformat(), **metrics}
          Path('training/latest_v04_status.json').write_text(json.dumps(data, indent=2))
          PY
          git add training/latest_v04_status.json training/latest_v04_training_log.txt
          if [ "$OUTCOME" = "success" ]; then git add -A models/micro-v0.4-preview; fi
          git commit -m "Report RogerVIB v0.4 epoch 4/5 ($OUTCOME) [skip ci]" || true
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - name: Stop after epoch 4 failure
        if: steps.epoch4.outcome != 'success'
        run: exit 1

      - name: Train epoch 5 of 5
        id: epoch5
        continue-on-error: true
        timeout-minutes: 5
        run: |
          set -o pipefail
          python -u training/train_v04_fast.py --epoch 5 2>&1 | tee training/epoch-5.log

      - name: Upload epoch 5 checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rogervib-v04-epoch-5-${{ github.run_id }}
          path: |
            training/v04_checkpoints/epoch-5
            training/epoch-5.log
            training/v04_epoch_5_metrics.json
          if-no-files-found: warn
          retention-days: 30

      - name: REPORT epoch 5
        if: always()
        env:
          OUTCOME: ${{ steps.epoch5.outcome }}
        run: |
          cp training/epoch-5.log training/latest_v04_training_log.txt 2>/dev/null || true
          if [ "$OUTCOME" = "success" ]; then
            rm -rf models/micro-v0.4-preview
            cp -R training/v04_checkpoints/epoch-5 models/micro-v0.4-preview
          fi
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          outcome = os.environ['OUTCOME']
          p = Path('training/v04_epoch_5_metrics.json')
          metrics = json.loads(p.read_text()) if p.exists() else {}
          data = {'status': 'EPOCH_5_COMPLETE' if outcome == 'success' else 'FAILED_EPOCH_5',
                  'epoch': 5, 'epochs': 5, 'outcome': outcome,
                  'reported_at': datetime.now(timezone.utc).isoformat(), **metrics}
          Path('training/latest_v04_status.json').write_text(json.dumps(data, indent=2))
          PY
          git add training/latest_v04_status.json training/latest_v04_training_log.txt
          if [ "$OUTCOME" = "success" ]; then git add -A models/micro-v0.4-preview; fi
          git commit -m "Report RogerVIB v0.4 epoch 5/5 ($OUTCOME) [skip ci]" || true
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - name: Stop after epoch 5 failure
        if: steps.epoch5.outcome != 'success'
        run: exit 1

      - name: Prepare final candidate path
        run: |
          rm -rf models/micro-v0.4
          cp -R training/v04_checkpoints/epoch-5 models/micro-v0.4
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('models/micro-v0.4/config.json')
          cfg = json.loads(p.read_text())
          cfg['name'] = 'RogerVIB Micro v0.4 Neural'
          cfg.pop('preview', None)
          cfg.pop('training_epoch', None)
          cfg.pop('training_epochs', None)
          cfg['training_profile'] = 'quality-h112-stateful-telemetry'
          p.write_text(json.dumps(cfg, indent=2))
          PY

      - name: Validate generated model
        id: validate
        continue-on-error: true
        run: python tests/validate_v04_artifact.py

      - name: REPORT validation
        if: always()
        env:
          OUTCOME: ${{ steps.validate.outcome }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          Path('training/latest_v04_status.json').write_text(json.dumps({
            'status': 'VALIDATION_PASSED' if os.environ['OUTCOME'] == 'success' else 'VALIDATION_FAILED',
            'outcome': os.environ['OUTCOME'],
            'reported_at': datetime.now(timezone.utc).isoformat()
          }, indent=2))
          PY
          git add training/latest_v04_status.json
          git commit -m "Report RogerVIB v0.4 validation ($OUTCOME) [skip ci]" || true
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - name: Stop after validation failure
        if: steps.validate.outcome != 'success'
        run: exit 1

      - name: Browser-like quality test
        id: quality
        continue-on-error: true
        env:
          ROGERVIB_QUALITY_REPORT: training/latest_v04_quality_report.txt
        run: python tests/smoke_v04_inference.py

      - name: Upload quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rogervib-v04-quality-${{ github.run_id }}
          path: training/latest_v04_quality_report.txt
          if-no-files-found: warn
          retention-days: 30

      - name: REPORT quality
        if: always()
        env:
          OUTCOME: ${{ steps.quality.outcome }}
        run: |
          if [ ! -f training/latest_v04_quality_report.txt ]; then
            echo 'Quality test did not produce a report.' > training/latest_v04_quality_report.txt
          fi
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          Path('training/latest_v04_status.json').write_text(json.dumps({
            'status': 'QUALITY_PASSED' if os.environ['OUTCOME'] == 'success' else 'QUALITY_FAILED',
            'outcome': os.environ['OUTCOME'],
            'reported_at': datetime.now(timezone.utc).isoformat()
          }, indent=2))
          PY
          git add training/latest_v04_status.json training/latest_v04_quality_report.txt
          git commit -m "Report RogerVIB v0.4 quality ($OUTCOME) [skip ci]" || true
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - name: Stop after quality failure
        if: steps.quality.outcome != 'success'
        run: exit 1

      - name: Publish final pretrained model
        run: |
          git add -A models/micro-v0.4
          git commit -m 'Train RogerVIB Micro v0.4 quality neural model [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: REPORT PUBLISHED
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          cfg = json.loads(Path('models/micro-v0.4/config.json').read_text())
          Path('training/latest_v04_status.json').write_text(json.dumps({
            'status': 'PUBLISHED',
            'artifact_revision': cfg.get('artifact_revision'),
            'parameter_count': cfg.get('parameter_count'),
            'reported_at': datetime.now(timezone.utc).isoformat(),
            'message': 'Final artifact passed validation and browser-like quality checks and was published.'
          }, indent=2))
          PY
          git add training/latest_v04_status.json
          git commit -m 'RogerVIB v0.4 training PUBLISHED [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
