name: Train Smarter v0.6

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/train-smarter-v1.yml'

permissions:
  contents: write

concurrency:
  group: train-smarter-v06
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install training dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Train v0.6 Smarter
        run: python train_smarter_v1.py

      - name: Prepare grounded runtime
        run: python prepare_smarter_v1.py

      - name: Run legacy Cool regression smoke test
        run: node test_cool_v1.js

      - name: Run strict Smarter grounding smoke test
        run: node test_smarter_v1.js

      - name: Wire v0.6 into RogerVIB
        run: python wire_cool_v1.py

      - name: Commit only a passing v0.6 build
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A cool-v1-config.js cool-v1-part*.js cool-v1-manifest.json models/cool.js index.html main.js cool-v1-loader.js
          git diff --cached --quiet && exit 0
          git commit -m 'Train and ship RogerVIB v0.6 Smarter [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
