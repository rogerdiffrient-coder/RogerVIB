name: Hotfix Cool calculator

on:
  push:
    paths:
      - 'hotfix_cool_calculator.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Patch Cool calculator handling
        run: python hotfix_cool_calculator.py
      - name: Run Cool language + tool smoke test
        run: node test_cool_v1.js
      - name: Wire Cool into RogerVIB
        run: python wire_cool_v1.py
      - name: Commit passing Cool runtime
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add models/cool.js test_cool_v1.js index.html main.js cool-v1-loader.js
          git diff --cached --quiet && exit 0
          git commit -m 'Fix Cool calculator and wire v0.5 [skip ci]'
          git pull --rebase origin main
          git push
