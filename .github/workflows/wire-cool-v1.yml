name: Wire Cool v1

on:
  workflow_run:
    workflows: ['Train Cool v1']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Wire Cool into RogerVIB
        run: python wire_cool_v1.py
      - name: Run Cool language + tool smoke test
        run: node test_cool_v1.js
      - name: Commit site wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html main.js cool-v1-loader.js
          git diff --cached --quiet && exit 0
          git commit -m 'Wire RogerVIB v0.5 Cool into site [skip ci]'
          git push
