name: Wire Cool v1

on:
  push:
    paths:
      - 'cool-v1-manifest.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire:
    if: github.actor == 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wire Cool into RogerVIB
        run: python wire_cool_v1.py
      - name: Commit site wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html main.js cool-v1-loader.js
          git diff --cached --quiet && exit 0
          git commit -m 'Wire RogerVIB v0.5 Cool into site [skip ci]'
          git push
